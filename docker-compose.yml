# ระบบย่อย csmju-study-qa: ฐานข้อมูลของตัวเอง + แอป (API และหน้าเว็บ origin เดียว)
# ไม่ต่อฐานข้อมูลของ Core Hub — ใช้แค่ JWKS และ SSO ของ Core Hub
#   docker compose up -d db          # เฉพาะฐานข้อมูล (ตอนพัฒนา)
#   docker compose up -d --build     # ทั้งระบบ
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_db
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
      TZ: UTC
    ports:
      # 5433 บนเครื่อง เพื่อไม่ชนกับฐานข้อมูลของ Core Hub ที่ 5432
      - "5433:5432"
    volumes:
      - helpdesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d helpdesk_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4235
      DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@db:5432/helpdesk_db
      SUBSYSTEM_ID: csmju-study-qa
      SUBSYSTEM_NAME: "ถาม-ตอบวิชาการ CS แม่โจ้"
      # Core Hub มักรันบนเครื่องตอนพัฒนา
      CORE_HUB_URL: ${CORE_HUB_URL:-http://host.docker.internal:3000}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-http://host.docker.internal:3000/api/v1/.well-known/jwks.json}
      CORE_HUB_ISSUER: ${CORE_HUB_ISSUER:-core-hub}
      CORE_HUB_AUDIENCE: ${CORE_HUB_AUDIENCE:-csmju2030}
      # /auth/login ส่ง "เบราว์เซอร์" ไปที่นี่ จึงต้องเป็น address ที่เบราว์เซอร์ใช้
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-http://localhost:3100}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "4235:4235"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4235/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  helpdesk_db_data:
